<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CEO Dashboard</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0A0F1E;
            --surface: #111827;
            --surface2: #1F2937;
            --border: #374151;
            --primary: #6366F1;
            --primary-light: #818CF8;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --info: #3B82F6;
            --text: #F9FAFB;
            --text-muted: #9CA3AF;
            --text-dim: #6B7280;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* ── LAYOUT ── */
        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 240px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-logo {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .logo-mark {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), #A78BFA);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .logo-text {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
        }

        .logo-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .sidebar-nav {
            flex: 1;
            padding: 1rem 0;
            overflow-y: auto;
        }

        .nav-section {
            padding: 0 1rem;
            margin-bottom: 0.5rem;
        }

        .nav-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            padding: 0.5rem 0.75rem;
            margin-bottom: 0.25rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 0.15rem;
        }

        .nav-item:hover {
            background: var(--surface2);
            color: var(--text);
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(167, 139, 250, 0.1));
            color: var(--primary-light);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .nav-item .icon {
            font-size: 1rem;
            width: 20px;
            text-align: center;
        }

        .nav-badge {
            margin-left: auto;
            background: var(--danger);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.15rem 0.45rem;
            border-radius: 50px;
        }

        .nav-badge.green {
            background: var(--success);
        }

        .nav-badge.yellow {
            background: var(--warning);
        }

        .sidebar-footer {
            padding: 1rem;
            border-top: 1px solid var(--border);
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* ── MAIN CONTENT ── */
        .main {
            margin-left: 240px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ── TOPBAR ── */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .topbar-left h1 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .topbar-left p {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 0.1rem;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.55rem 1.1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-light);
        }

        .btn-ghost {
            background: var(--surface2);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            color: var(--text);
            border-color: var(--text-muted);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ── PAGE CONTENT ── */
        .page {
            padding: 1.5rem;
            flex: 1;
        }

        /* ── CARDS ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
        }

        .card-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* ── STAT CARDS ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .stat-card:hover {
            border-color: var(--primary);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            opacity: 0.05;
        }

        .stat-card.purple::before {
            background: var(--primary);
        }

        .stat-card.green::before {
            background: var(--success);
        }

        .stat-card.yellow::before {
            background: var(--warning);
        }

        .stat-card.red::before {
            background: var(--danger);
        }

        .stat-icon {
            font-size: 1.3rem;
            margin-bottom: 0.75rem;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.3rem;
        }

        .stat-card.purple .stat-value {
            color: var(--primary-light);
        }

        .stat-card.green .stat-value {
            color: var(--success);
        }

        .stat-card.yellow .stat-value {
            color: var(--warning);
        }

        .stat-card.red .stat-value {
            color: var(--danger);
        }

        .stat-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .stat-change {
            font-size: 0.72rem;
            margin-top: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .stat-change.up {
            color: var(--success);
        }

        .stat-change.down {
            color: var(--danger);
        }

        /* ── GRID LAYOUTS ── */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
        }

        /* ── TABLE ── */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.83rem;
        }

        th {
            text-align: left;
            padding: 0.6rem 0.75rem;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid rgba(55, 65, 81, 0.5);
            color: var(--text-muted);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .hover-row:hover {
            background: rgba(255, 255, 255, 0.03) !important;
        }

        /* ── BADGES ── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.6rem;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .badge-danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        .badge-info {
            background: rgba(59, 130, 246, 0.15);
            color: var(--info);
        }

        .badge-purple {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary-light);
        }

        .badge-gray {
            background: rgba(107, 114, 128, 0.15);
            color: var(--text-dim);
        }

        /* ── PROGRESS BAR ── */
        .progress-bar {
            height: 6px;
            background: var(--surface2);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.8s ease;
        }

        /* ── CHANNEL METERS ── */
        .channel-meters {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .channel-meter {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .channel-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
        }

        .channel-name {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text);
            font-weight: 500;
        }

        .channel-count {
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        /* ── LEAD ROW ── */
        .lead-score {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.78rem;
        }

        .score-dots {
            display: flex;
            gap: 2px;
        }

        .score-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--border);
        }

        .score-dot.filled {
            background: var(--primary);
        }

        /* ── TASK LIST ── */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: var(--surface2);
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
        }

        .task-item:hover {
            border-color: var(--border);
        }

        .task-item.critical {
            border-left: 3px solid var(--danger);
        }

        .task-item.high {
            border-left: 3px solid var(--warning);
        }

        .task-item.medium {
            border-left: 3px solid var(--info);
        }

        .task-item.low {
            border-left: 3px solid var(--border);
        }

        .task-urgency-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .task-urgency-dot.critical {
            background: var(--danger);
        }

        .task-urgency-dot.high {
            background: var(--warning);
        }

        .task-urgency-dot.medium {
            background: var(--info);
        }

        .task-urgency-dot.low {
            background: var(--text-dim);
        }

        .task-info {
            flex: 1;
            min-width: 0;
        }

        .task-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
        }

        .task-reason {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.15rem;
        }

        .task-command {
            font-size: 0.72rem;
            color: var(--primary-light);
            font-family: monospace;
            margin-top: 0.25rem;
        }

        /* ── REPLY CARDS ── */
        .reply-cards {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .reply-card {
            padding: 1rem;
            background: var(--surface2);
            border-radius: 10px;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }

        .reply-card.interested {
            border-left: 3px solid var(--success);
        }

        .reply-card.not_interested {
            border-left: 3px solid var(--danger);
        }

        .reply-card.question {
            border-left: 3px solid var(--info);
        }

        .reply-card.out_of_office {
            border-left: 3px solid var(--text-dim);
        }

        .reply-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .reply-business {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .reply-email {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .reply-body {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0.5rem 0;
            padding: 0.6rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            font-style: italic;
        }

        .reply-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .reply-draft {
            margin-top: 0.75rem;
            padding: 0.75rem;
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 8px;
        }

        .reply-draft-label {
            font-size: 0.72rem;
            color: var(--primary-light);
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .reply-draft-text {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* ── HEALTH GAUGE ── */
        .health-gauge {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem 0;
        }

        .gauge-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
            margin-bottom: 0.75rem;
        }

        .gauge-score {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1;
        }

        .gauge-label {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* ── ALERT BANNER ── */
        .alert-banner {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .alert-banner.danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
        }

        .alert-banner.warning {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #FCD34D;
        }

        .alert-banner.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6EE7B7;
        }

        /* ── CEO MESSAGE ── */
        .ceo-message {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(167, 139, 250, 0.05));
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
        }

        .ceo-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), #A78BFA);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            margin-bottom: 0.75rem;
        }

        .ceo-message-text {
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--text-muted);
        }

        /* ── TIMELINE ── */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .timeline-item {
            display: flex;
            gap: 1rem;
            padding-bottom: 1rem;
            position: relative;
        }

        .timeline-item:not(:last-child)::before {
            content: '';
            position: absolute;
            left: 11px;
            top: 24px;
            bottom: 0;
            width: 1px;
            background: var(--border);
        }

        .timeline-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
            margin-top: 0.1rem;
        }

        .timeline-content {
            flex: 1;
        }

        .timeline-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
        }

        .timeline-time {
            font-size: 0.72rem;
            color: var(--text-dim);
            margin-top: 0.1rem;
        }

        .timeline-detail {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
            line-height: 1.5;
        }

        /* ── LOADING ── */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            color: var(--text-muted);
            flex-direction: column;
            gap: 0.75rem;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── EMPTY STATE ── */
        .empty {
            text-align: center;
            padding: 2.5rem;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
        }

        .empty-text {
            font-size: 0.88rem;
        }

        /* ── TABS ── */
        .tabs {
            display: flex;
            gap: 0.25rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.25rem;
        }

        .tab {
            padding: 0.6rem 1rem;
            font-size: 0.83rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            margin-bottom: -1px;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab.active {
            color: var(--primary-light);
            border-bottom-color: var(--primary);
        }

        /* ── RESPONSIVE & MOBILE OPTIMIZATIONS ── */
        .hamburger-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 8px;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            margin-right: 0.75rem;
            border: 1px solid var(--border);
        }

        .hamburger-btn:hover {
            background: var(--surface2);
            border-color: var(--text-muted);
        }

        .sidebar-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 16, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 998;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .responsive-grid-2-1 {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 1.5rem;
        }

        .outreach-grid {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 1.5rem;
        }

        .grid-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .grid-env {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            html, body {
                width: 100%;
                overflow-x: hidden;
                position: relative;
            }

            .layout, .main {
                width: 100%;
                max-width: 100vw;
                overflow-x: hidden;
                position: relative;
            }

            .card {
                padding: 0.85rem !important;
            }

            .reply-cards {
                grid-template-columns: 1fr !important;
                gap: 1rem !important;
            }

            .reply-card {
                padding: 1rem !important;
            }

            .reply-draft {
                padding: 0.75rem !important;
            }

            .hamburger-btn {
                display: inline-flex;
            }

            .responsive-grid-2-1,
            .outreach-grid,
            .grid-actions,
            .grid-env {
                grid-template-columns: 1fr;
            }

            .outreach-grid > div:first-child {
                border-right: none !important;
                border-bottom: 1px solid var(--border);
                padding-right: 0 !important;
                padding-bottom: 1rem;
                max-height: 200px !important;
            }

            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                width: 270px;
                transform: translateX(-100%);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 999;
                box-shadow: 25px 0 50px -12px rgba(0, 0, 0, 0.8);
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
            }

            .topbar {
                padding: 1rem;
            }

            .topbar-left h1 {
                font-size: 1rem;
            }

            .topbar-left p {
                font-size: 0.72rem;
            }

            .stats-grid {
                grid-template-columns: 1fr; /* Stack stats cards vertically on mobile */
            }

            .grid-3 {
                grid-template-columns: 1fr;
            }

            .page {
                padding: 1rem;
            }

            /* Responsive tables for smaller screens */
            .table-wrapper {
                margin: 0 -1rem;
                padding: 0 1rem;
                border-radius: 0;
                border-left: none;
                border-right: none;
            }
            
            /* Responsive modals */
            .terminal-window {
                width: 95% !important;
                height: 80vh !important;
                margin: 0 auto;
            }
        }

        @media (max-width: 480px) {
            .topbar {
                flex-direction: column;
                align-items: stretch;
                gap: 0.75rem;
            }

            .topbar-left {
                width: 100%;
            }

            .topbar-right {
                width: 100%;
                justify-content: flex-end;
                gap: 0.5rem;
            }

            .btn {
                padding: 0.45rem 0.8rem;
                font-size: 0.75rem;
                flex: 1;
                justify-content: center;
            }
        }

        /* ── UTILITIES ── */
        .mb-1 {
            margin-bottom: 0.5rem;
        }

        .mb-2 {
            margin-bottom: 1rem;
        }

        .mb-3 {
            margin-bottom: 1.5rem;
        }

        .flex {
            display: flex;
        }

        .items-center {
            align-items: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .gap-1 {
            gap: 0.5rem;
        }

        .gap-2 {
            gap: 1rem;
        }

        .text-sm {
            font-size: 0.82rem;
        }

        .text-xs {
            font-size: 0.72rem;
        }

        .text-muted {
            color: var(--text-muted);
        }

        .text-dim {
            color: var(--text-dim);
        }

        .text-success {
            color: var(--success);
        }

        .text-danger {
            color: var(--danger);
        }

        .text-warning {
            color: var(--warning);
        }

        .text-primary {
            color: var(--primary-light);
        }

        .font-bold {
            font-weight: 700;
        }

        .truncate {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .w-full {
            width: 100%;
        }

        /* ── FORMS ── */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .form-input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.65rem 0.85rem;
            color: var(--text);
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        /* ── TERMINAL MODAL ── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 2rem;
        }

        .terminal-window {
            width: 100%;
            max-width: 900px;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            height: 80vh;
        }

        .terminal-header {
            background: #161b22;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .terminal-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .terminal-controls {
            display: flex;
            gap: 0.5rem;
        }

        .control-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .terminal-body {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.85rem;
            color: #d1d5db;
            line-height: 1.5;
            background: #0d1117;
        }

        .terminal-line {
            margin-bottom: 0.25rem;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .terminal-line.command {
            color: var(--primary-light);
            font-weight: 700;
            margin-top: 1rem;
        }

        .terminal-line.error {
            color: var(--danger);
        }

        .terminal-line.success {
            color: var(--success);
        }

        .terminal-cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background: var(--primary-light);
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }

        .terminal-footer {
            background: #161b22;
            padding: 0.6rem 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
        }

        /* ── ROADMAP ── */
        .roadmap-steps {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            padding: 0.5rem 0;
        }

        .roadmap-step {
            display: flex;
            align-items: center;
            gap: 1rem;
            position: relative;
        }

        .step-line {
            position: absolute;
            left: 17px;
            top: 36px;
            width: 2px;
            height: 20px;
            background: var(--border);
            z-index: 0;
        }

        .roadmap-step.complete .step-line {
            background: var(--success);
        }

        .step-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface2);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            z-index: 1;
            transition: all 0.3s;
        }

        .roadmap-step.complete .step-icon {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--success);
            color: var(--success);
        }

        .roadmap-step.active .step-icon {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        .step-content {
            flex: 1;
        }

        .step-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text);
        }

        .step-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.1rem;
        }

        .step-status {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pulse-text {
            animation: pulse-opacity 2s infinite;
        }

        @keyframes pulse-opacity {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ── DETAIL MODAL ── */
        .modal-window {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: modal-in 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-window.wide {
            max-width: 900px;
        }

        @keyframes modal-in {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            flex: 1;
        }

        .modal-body.scrollable {
            max-height: 70vh;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .detail-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 0.35rem;
        }

        .detail-value {
            font-size: 0.9rem;
            color: var(--text);
            font-weight: 500;
        }

        .detail-section {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .detail-section-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
        }

        /* ── ENHANCED MODAL STYLES ── */
        .input-sm {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            font-size: 0.85rem;
            width: 100%;
            transition: all 0.2s;
        }

        .input-sm:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        textarea.input-sm {
            min-height: 80px;
            resize: vertical;
        }

        .detail-section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            transition: transform 0.2s;
        }

        .info-card:hover {
            border-color: var(--text-dim);
        }

        .info-card-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* ── INBOX & REPLY MANAGER ── */
        .reply-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
            margin-top: 1.25rem;
        }

        .reply-card {
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.7), rgba(31, 41, 55, 0.4));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);
        }

        .reply-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 20px rgba(99, 102, 241, 0.1);
        }

        .reply-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: var(--border);
            transition: all 0.3s;
        }

        /* Intent accent top borders & shadows */
        .reply-card.interested::before {
            background: linear-gradient(90deg, #10B981, #059669);
        }
        .reply-card.interested {
            box-shadow: 0 10px 30px -10px rgba(16, 185, 129, 0.15);
        }
        .reply-card.interested:hover {
            box-shadow: 0 20px 40px -15px rgba(16, 185, 129, 0.3), 0 0 25px rgba(16, 185, 129, 0.15);
        }

        .reply-card.question::before {
            background: linear-gradient(90deg, #3B82F6, #1D4ED8);
        }
        .reply-card.question {
            box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.15);
        }
        .reply-card.question:hover {
            box-shadow: 0 20px 40px -15px rgba(59, 130, 246, 0.3), 0 0 25px rgba(59, 130, 246, 0.15);
        }

        .reply-card.not_interested::before {
            background: linear-gradient(90deg, #EF4444, #B91C1C);
        }
        .reply-card.not_interested {
            box-shadow: 0 10px 30px -10px rgba(239, 68, 68, 0.05);
        }
        .reply-card.not_interested:hover {
            box-shadow: 0 20px 40px -15px rgba(239, 68, 68, 0.15);
        }

        .reply-card.out_of_office::before, .reply-card.other::before {
            background: linear-gradient(90deg, var(--text-dim), var(--border));
        }

        .reply-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            position: relative;
            z-index: 2;
        }

        .reply-business {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.2px;
        }

        .reply-email {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
            font-family: monospace;
        }

        .reply-body {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.85rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            margin-bottom: 1rem;
            font-style: italic;
            position: relative;
            z-index: 2;
            max-height: 120px;
            overflow-y: auto;
            white-space: pre-line;
        }

        .reply-draft {
            background: rgba(99, 102, 241, 0.04);
            border: 1px solid rgba(99, 102, 241, 0.15);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.25rem;
            position: relative;
            z-index: 2;
        }

        .reply-draft-label {
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--primary-light);
            letter-spacing: 0.8px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .reply-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
            position: relative;
            z-index: 2;
        }

        .reply-actions .btn {
            flex: 1;
            justify-content: center;
            font-size: 0.78rem;
            padding: 0.5rem 0.75rem;
        }

        /* Ambient radial backgrounds */
        .reply-card::after {
            content: '';
            position: absolute;
            bottom: -30px;
            right: -30px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
            transition: all 0.3s;
        }

        .reply-card:hover::after {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
        }

        /* ── OUTREACH DETAILED LOGS ── */
        .logs-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .log-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .log-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 4px;
            background: var(--text-dim);
            transition: all 0.3s;
        }

        .log-card.channel-email::before {
            background: linear-gradient(to bottom, #6366F1, #818CF8);
        }

        .log-card.channel-whatsapp::before {
            background: linear-gradient(to bottom, #10B981, #34D399);
        }

        .log-card.channel-facebook::before {
            background: linear-gradient(to bottom, #3B82F6, #60A5FA);
        }

        .log-card.channel-instagram::before {
            background: linear-gradient(to bottom, #E1306C, #F43F5E);
        }

        .log-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            transform: translateY(-2px);
        }

        .log-header {
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .log-meta-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex: 1;
            min-width: 0;
        }

        .log-channel-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            text-transform: uppercase;
        }

        .log-channel-badge.email {
            background: rgba(99, 102, 241, 0.12);
            color: var(--primary-light);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .log-channel-badge.whatsapp {
            background: rgba(16, 185, 129, 0.12);
            color: #34D399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .log-channel-badge.facebook {
            background: rgba(59, 130, 246, 0.12);
            color: #60A5FA;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .log-channel-badge.instagram {
            background: rgba(225, 48, 108, 0.12);
            color: #F43F5E;
            border: 1px solid rgba(225, 48, 108, 0.2);
        }

        .log-business-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .log-direction {
            font-size: 0.78rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .log-meta-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        .log-time {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .log-expand-icon {
            font-size: 0.8rem;
            color: var(--text-dim);
            transition: transform 0.3s;
            width: 16px;
            text-align: center;
        }

        .log-card.is-expanded .log-expand-icon {
            transform: rotate(180deg);
        }

        .log-body {
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.15);
            padding: 1.25rem;
            animation: slideDown 0.25s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .log-routing-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1rem;
            background: var(--surface2);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .log-route-item {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .log-route-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            font-weight: 600;
        }

        .log-route-value {
            font-size: 0.82rem;
            color: var(--text);
            font-family: monospace;
            word-break: break-all;
        }

        .log-message-preview {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid var(--border);
            font-size: 0.82rem;
            line-height: 1.55;
            color: var(--text-muted);
            white-space: pre-wrap;
        }

        .log-message-subject {
            font-weight: 700;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
